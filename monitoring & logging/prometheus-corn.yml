# prometheus-corn.yml - Config Prometheus untuk Corn Model Serving + Postgres
# Scrape corn exporter (8000) + postgres-exporter (9187) + self

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: []

scrape_configs:
  # Self Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Corn API Exporter
  - job_name: 'corn-exporter'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'

  # Postgres Exporter (untuk dashboard)
  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:9187']
    metrics_path: '/metrics'

  # Corn Model Server direct (fallback /metrics)
  - job_name: 'corn-server'
    static_configs:
      - targets: ['localhost:5000']
    metrics_path: '/metrics'

  # cAdvisor Docker metrics
  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: '/metrics'

